agent_name: "PPO"

model:
  actor_net: "fc_2layers_256units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.12
  critic_net: "fc_2layers_256units"

actor_optimizer:
  type: "Adam"
  learning_rate: 0.0003
critic_optimizer:
  type: "Adam"
  learning_rate: 0.0005

discount: 0.99
steps_per_iter: 32
iters_per_output: 10
test_episodes: 16
normalizer_samples: 100000
use_mixed_precision: false

actor_epochs: 3
actor_batch_size: 32
critic_epochs: 3
critic_batch_size: 32
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 1.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
